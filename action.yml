name: EventCatalog Agents
description: AI agents that keep your EventCatalog documentation in sync with your code. Runs in CI as a GitHub Action.

inputs:
  catalog-repo:
    description: EventCatalog repository to check out, in owner/repo format.
    required: true
  catalog-ref:
    description: Branch to check out from the EventCatalog repository and target with documentation pull requests.
    required: false
    default: main
  catalog-token:
    description: Optional token used to check out the EventCatalog repository and open documentation pull requests. Defaults to github.token. Ignored when github-app-client-id is set.
    required: false
  github-app-client-id:
    description: Optional Client ID of a GitHub App installed on the catalog repository. When set with github-app-private-key, the agent uses a short-lived token from the App instead of catalog-token, and catalog pull requests are opened by the App's bot account.
    required: false
  github-app-private-key:
    description: Private key of the GitHub App set in github-app-client-id. Pass it from a secret.
    required: false
  catalog-url:
    description: Optional URL of your hosted EventCatalog. When provided, breaking-changes and adr-compliance comments link to the catalog.
    required: false
  model:
    description: 'Model specifier for the documentation agent. See available models: https://pi.dev/models'
    required: false
    default: anthropic/claude-sonnet-4-6
  ignore-paths:
    description: Comma-separated paths or glob patterns to ignore when collecting pull request changed files.
    required: false
    default: node_modules,dist,build,coverage,.next,.nuxt,.output,.svelte-kit,.astro,.turbo,.cache,.vite,.vercel,.netlify,out,target,bin,obj,vendor
  agent:
    description: 'Which agent to run on each pull request. Available: code-to-docs, breaking-changes, adr-compliance.'
    required: false
    default: code-to-docs
  adrs:
    description: 'Required for the adr-compliance agent. Comma-separated globs, relative to the catalog root, selecting the ADRs to check pull requests against (e.g. adrs/**, domains/Orders/**).'
    required: false
  schema-extensions:
    description: Comma-separated file extensions the breaking-changes agent treats as message schemas. Add others (e.g. .js) to match where your contracts live.
    required: false
    default: .json,.yml,.yaml,.avro,.avsc,.proto,.graphql,.gql

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Resolve catalog repository
      id: catalog
      shell: bash
      env:
        CATALOG_REPO: ${{ inputs.catalog-repo }}
      run: |
        echo "owner=${CATALOG_REPO%%/*}" >> "$GITHUB_OUTPUT"
        echo "name=${CATALOG_REPO#*/}" >> "$GITHUB_OUTPUT"

    # A short-lived token scoped to the catalog repository, so pull requests come from the App's bot
    # account rather than a person, and no personal token has to be stored.
    - name: Create GitHub App token
      id: app-token
      if: inputs.github-app-client-id != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: ${{ steps.catalog.outputs.owner }}
        repositories: ${{ steps.catalog.outputs.name }}

    - name: Checkout EventCatalog
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.catalog-repo }}
        ref: ${{ inputs.catalog-ref }}
        token: ${{ steps.app-token.outputs.token || inputs.catalog-token || github.token }}
        path: eventcatalog

    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --prod=false --frozen-lockfile

    - name: Run EventCatalog agents
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        EVENTCATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENTCATALOG_MODEL: ${{ inputs.model }}
        EVENTCATALOG_CATALOG_REF: ${{ inputs.catalog-ref }}
        EVENTCATALOG_CATALOG_REPO: ${{ inputs.catalog-repo }}
        EVENTCATALOG_CATALOG_PATH: eventcatalog
        EVENTCATALOG_CATALOG_TOKEN: ${{ steps.app-token.outputs.token || inputs.catalog-token || github.token }}
        EVENTCATALOG_CATALOG_URL: ${{ inputs.catalog-url }}
        EVENTCATALOG_GITHUB_REPOSITORY: ${{ github.repository }}
        EVENTCATALOG_GITHUB_TOKEN: ${{ github.token }}
        EVENTCATALOG_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENTCATALOG_IGNORE_PATHS: ${{ inputs.ignore-paths }}
        EVENTCATALOG_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENTCATALOG_EVENT_ACTION: ${{ github.event.action }}
        EVENTCATALOG_PR_MERGED: ${{ github.event.pull_request.merged }}
        EVENTCATALOG_AGENT: ${{ inputs.agent }}
        EVENTCATALOG_ADRS: ${{ inputs.adrs }}
        EVENTCATALOG_SCHEMA_EXTENSIONS: ${{ inputs.schema-extensions }}
      run: |
        payload="$(node --input-type=module -e 'console.log(JSON.stringify({ adrs: process.env.EVENTCATALOG_ADRS || undefined, baseSha: process.env.EVENTCATALOG_BASE_SHA || undefined, catalogPath: process.env.EVENTCATALOG_CATALOG_PATH, catalogRepo: process.env.EVENTCATALOG_CATALOG_REPO, catalogUrl: process.env.EVENTCATALOG_CATALOG_URL || undefined, headSha: process.env.EVENTCATALOG_HEAD_SHA || undefined, ignorePaths: process.env.EVENTCATALOG_IGNORE_PATHS, model: process.env.EVENTCATALOG_MODEL, schemaExtensions: process.env.EVENTCATALOG_SCHEMA_EXTENSIONS || undefined, workspace: process.env.GITHUB_WORKSPACE }))')"

        # src/run.ts maps the requested agent to its workflow. To run more than one agent, add another
        # step (or workflow file) with a different `agent`.
        agent="$(echo "$EVENTCATALOG_AGENT" | xargs)" # trim whitespace
        pnpm exec tsx src/run.ts "$agent" --payload "$payload"
