# Builds, typechecks and runs the offline evals on every pull request and push to main. The live model
# evals need provider keys, which this workflow doesn't have, so they skip themselves.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the older run for the same pull request or branch. Pull requests and pushes never
# share a group, so a late pull request run can't cancel a run on main.
concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Build, typecheck and run the offline evals
        run: pnpm test
